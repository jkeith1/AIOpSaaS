apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      serviceAccountName: aiops-agent
      containers:
      - name: aiops-agent
        image: localhost/aiops-agent:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "256Mi"
          limits:
            memory: "512Mi"
        env:
        - name: CLAUDE_API_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-agent-secrets
              key: CLAUDE_API_KEY
        - name: DEFAULT_NAMESPACE
          value: "default"

