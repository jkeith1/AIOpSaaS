{{- if .Values.kubernetes.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aiops-agent.fullname" . }}
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
rules:
  # Read cluster resources
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - events
      - services
      - configmaps
      - secrets
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  
  # Read workload resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  
  # Read job resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  
  # Read metrics (if available)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  
  # Read Horizontal Pod Autoscalers
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  
  # Network policies
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aiops-agent.fullname" . }}
  labels:
    {{- include "aiops-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aiops-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aiops-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
