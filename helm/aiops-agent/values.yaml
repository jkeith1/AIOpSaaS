# Default values for the aiops-agent Helm chart.

replicaCount: 1

image:
  repository: localhost:5001/aiops-agent
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: aiops-agent

# ---------------------------------------------------------------------------
# LLM provider
# ---------------------------------------------------------------------------
# provider options:
#   claude        - Anthropic Messages API (default; only needs `anthropic`)
#   claude-agent  - Claude Agent SDK; Claude calls the kubectl tools itself.
#                   Requires an image built with --build-arg INSTALL_AGENT_SDK=true
#   openai        - OpenAI
#   copilot-sdk   - GitHub Copilot SDK (registered, not installed by default)
llmConfig:
  provider: "claude"

  # Where the API key comes from. Create it with:
  #   kubectl create secret generic aiops-secrets \
  #     --from-literal=llm-api-key="sk-ant-..." -n aiops
  apiKeySecret:
    name: aiops-secrets
    key: llm-api-key

  # Empty = the provider's own default (currently claude-sonnet-5).
  # Other options: claude-opus-5, claude-haiku-4-5-20251001
  model: "claude-sonnet-5"
  # Low temperature: triage should be reproducible, not creative.
  temperature: 0.2
  maxTokens: 4096
  # Seconds to wait on a single API call.
  timeout: 120
  # Max tool-use round trips for the claude-agent provider.
  agentMaxTurns: 20

# Kept for backwards compatibility with older value files.
llmProvider: "claude"

# ---------------------------------------------------------------------------
# GitHub Copilot (disabled - kept so the provider stays switchable)
# ---------------------------------------------------------------------------
github:
  copilot:
    enabled: false
    apiEndpoint: "https://api.github.com/copilot"
  token:
    secret: aiops-secrets
    key: github-token

# ---------------------------------------------------------------------------
# Kubernetes introspection
# ---------------------------------------------------------------------------
kubernetes:
  watchNamespaces:
    - default
    - aiops
  # Cap on how many unhealthy pods get an individual deep-dive per namespace.
  maxPodsPerNamespace: 5
  rbac:
    create: true
    serviceAccountName: aiops-agent
    # Cluster-wide Secret read access. Off by default: this agent sends what it
    # reads to a third-party LLM API, and nothing in the triage path needs
    # Secret contents.
    allowSecretsRead: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

podSecurityPolicy:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  fsReadOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

schedule:
  enabled: true
  interval: "*/5 * * * *"
  # Skip a run if the previous one is still going.
  concurrencyPolicy: Forbid
  # Hard stop for a single run, so a hung kubectl cannot pile up jobs.
  activeDeadlineSeconds: 900

logging:
  level: "info"
  format: "json"

podDisruptionBudget:
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

affinity: {}
tolerations: []
nodeSelector: {}

labels:
  app: aiops-agent
  version: "0.1.0"

annotations: {}
